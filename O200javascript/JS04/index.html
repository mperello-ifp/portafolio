<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js03</title>

    <style>
        body{
            font-size: 3rem;
            font-family: helvetica;
        }
    </style>
</head>
<body>
    <script type="text/javascript" language="javascript">
        // Declaració de variables
        var verd="verd"
        var vermell="vermell";
        var blau="blau";

        //Prompt per demanar informació/entrada de dades
        var color=prompt("Quin color vols?")


        // Comparem les dades unes amb les altres

        if(color==verd){
            document.write ("Passa");
            document.body.style.backgroundColor="#3cb371";
            document.body.style.color="#FFF";
        }

         else if(color==vermell){
            document.write ("Stop");
            document.body.style.backgroundColor="#ff6347";
            document.body.style.color="#FFA";
        }

        else if(color==blau){
            document.write ("extra");
            document.body.style.backgroundColor="blue"
            document.body.style.color="#FFF";
        }


        else{
            document.write ("Alerta");
            document.body.style.backgroundColor="#FFA500";
            document.body.style.color="#FFA";

        }
    </script>
</body>
</html>
